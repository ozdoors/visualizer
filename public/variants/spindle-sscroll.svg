<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <g id="s" fill="none" stroke="#5b6069" stroke-width="3.5" stroke-linecap="round">
      <path d="M6,-16 C-8,-16 -8,-3 0,0 C8,3 8,16 -6,16"/>
      <circle cx="6" cy="-16" r="2.4" fill="#5b6069" stroke="none"/>
      <circle cx="-6" cy="16" r="2.4" fill="#5b6069" stroke="none"/>
    </g>
  </defs>
  <rect width="400" height="300" fill="#eef1f6"/>
  <rect x="40" y="70" width="320" height="10" fill="#8a9099"/>
  <rect x="40" y="220" width="320" height="10" fill="#8a9099"/>
  <!-- straight pickets -->
  <g fill="#9aa0a8">
    <rect x="70" y="80" width="7" height="140"/>
    <rect x="110" y="80" width="7" height="140"/>
    <rect x="150" y="80" width="7" height="140"/>
    <rect x="190" y="80" width="7" height="140"/>
    <rect x="230" y="80" width="7" height="140"/>
    <rect x="270" y="80" width="7" height="140"/>
    <rect x="310" y="80" width="7" height="140"/>
  </g>
  <!-- symmetric S-scroll cluster: 2 paired centre + upper L/R + lower L/R -->
  <use href="#s" transform="translate(185,150)"/>
  <use href="#s" transform="translate(215,150) scale(-1,1)"/>
  <use href="#s" transform="translate(140,112)"/>
  <use href="#s" transform="translate(260,112) scale(-1,1)"/>
  <use href="#s" transform="translate(140,188)"/>
  <use href="#s" transform="translate(260,188) scale(-1,1)"/>
  <rect x="46" y="60" width="14" height="180" fill="#6b7280"/>
  <rect x="340" y="60" width="14" height="180" fill="#6b7280"/>
</svg>
